<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | United Functions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #ffffff;
      --fg:     #000000;
      --muted:  #666666;
      --dim:    #aaaaaa;
      --border: rgba(0,0,0,0.1);
      --font:   'Inter', 'Helvetica Neue', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-weight: 300;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAV ─── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo img { height: clamp(12px, 3vw, 18px); transition: opacity 0.3s; }
    .nav-logo img:hover { opacity: 0.5; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      color: var(--fg);
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: opacity 0.3s;
    }
    .nav-links a:hover, .nav-links a.active { opacity: 0.35; }
    .nav-toggle { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
    .nav-toggle span { display: block; width: 22px; height: 1px; background: var(--fg); }

    /* ─── PAGE HEADER ─── */
    .page-header {
      padding: clamp(7rem, 14vw, 10rem) clamp(1.5rem, 4vw, 3rem) 0;
      border-bottom: 1px solid var(--fg);
      margin-bottom: 0;
    }
    .page-header-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 1.5rem;
    }
    .page-title {
      font-size: clamp(3.5rem, 10vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      line-height: 0.9;
    }
    .page-meta {
      text-align: right;
      flex-shrink: 0;
    }
    .page-sub {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.5rem;
    }
    .ig-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      text-decoration: none;
      color: var(--fg);
      font-size: 0.68rem;
      letter-spacing: 0.12em;
      border: 1px solid var(--fg);
      padding: 0.4rem 0.9rem;
      transition: background 0.22s, color 0.22s;
    }
    .ig-link:hover { background: var(--fg); color: var(--bg); }

    /* ─── GALLERY ─── */
    .gallery-wrap {
      padding: 2.5rem clamp(1rem, 3vw, 2.5rem) 6rem;
    }
    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
    }
    .post-count {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--dim);
      text-transform: uppercase;
    }

    /* MASONRY */
    .grid {
      columns: 4;
      column-gap: 8px;
    }
    @media (max-width: 1100px) { .grid { columns: 3; } }
    @media (max-width: 700px)  { .grid { columns: 2; } }
    @media (max-width: 400px)  { .grid { columns: 1; } }

    .grid-item {
      break-inside: avoid;
      margin-bottom: 8px;
      position: relative;
      overflow: hidden;
      background: #f0f0f0;
      cursor: pointer;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .grid-item.visible { opacity: 1; transform: translateY(0); }
    .grid-item img, .grid-item video {
      display: block; width: 100%; height: auto;
      transition: transform 0.45s ease;
    }
    .grid-item:hover img,
    .grid-item:hover video { transform: scale(1.04); }

    .grid-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0);
      transition: background 0.35s;
      display: flex; align-items: center; justify-content: center;
    }
    .grid-item:hover .grid-overlay { background: rgba(0,0,0,0.4); }

    .overlay-icon {
      color: rgba(255,255,255,0.9);
      font-size: 1rem;
      opacity: 0;
      transition: opacity 0.25s;
      width: 40px; height: 40px;
      border: 1px solid rgba(255,255,255,0.7);
      display: flex; align-items: center; justify-content: center;
    }
    .grid-item:hover .overlay-icon { opacity: 1; }

    .video-badge {
      position: absolute; top: 0.5rem; left: 0.5rem;
      background: rgba(0,0,0,0.6); color: rgba(255,255,255,0.9);
      font-size: 0.55rem; letter-spacing: 0.12em;
      padding: 0.18rem 0.45rem;
      pointer-events: none;
    }

    /* ─── LIGHTBOX ─── */
    .lightbox {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,0.97); z-index: 200;
      justify-content: center; align-items: center; padding: 1.5rem;
    }
    .lightbox.open { display: flex; }
    .lb-inner {
      position: relative; max-width: 1000px; width: 100%;
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
    }
    .lb-inner img, .lb-inner video {
      max-width: 100%; max-height: 85vh; object-fit: contain; display: block;
    }
    .lb-controls {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: calc(100% + 80px); left: -40px;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    .lb-arrow {
      pointer-events: all;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.6);
      width: 44px; height: 44px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1rem; transition: background 0.25s, color 0.25s;
    }
    .lb-arrow:hover { background: rgba(255,255,255,0.18); color: #fff; }
    .lb-close {
      position: absolute; top: -2.8rem; right: 0;
      background: none; border: none; color: rgba(255,255,255,0.4);
      font-size: 1.4rem; cursor: pointer; transition: color 0.25s;
    }
    .lb-close:hover { color: #fff; }
    .lb-counter { font-size: 0.65rem; letter-spacing: 0.2em; color: rgba(255,255,255,0.3); }

    /* ─── FOOTER ─── */
    footer {
      padding: 2.5rem 3rem; border-top: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center;
    }
    .footer-logo { height: 16px; }
    .footer-text { font-size: 0.62rem; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; }

    /* ─── MOBILE MENU ─── */
    .mob-menu {
      display: none; position: fixed; inset: 0;
      background: #000; z-index: 200;
      flex-direction: column; justify-content: center; align-items: center; gap: 1.8rem;
    }
    .mob-menu.open { display: flex; }
    .mob-menu a {
      color: #fff; text-decoration: none;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase;
      transition: opacity 0.3s;
    }
    .mob-menu a:hover { opacity: 0.35; }
    .mob-close {
      position: absolute; top: 1.5rem; right: 2rem;
      background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;
    }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      .nav-toggle { display: flex; }
      .page-header-inner { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
      .page-meta { text-align: left; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
      .lb-controls { width: calc(100% + 48px); left: -24px; }
      .lb-arrow { width: 36px; height: 36px; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="index.html">
    <img src="img/UFLogo_white2.png" alt="United Functions">
  </a>
  <ul class="nav-links">
    <li><a href="index.html#profile">Profile</a></li>
    <li><a href="index.html#career">Career</a></li>
    <li><a href="index.html#clients">Clients</a></li>
    <li><a href="gallery.html" class="active">Gallery</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-toggle" id="navToggle"><span></span><span></span><span></span></div>
</nav>

<!-- MOBILE MENU -->
<div class="mob-menu" id="mobMenu">
  <button class="mob-close" id="mobClose">✕</button>
  <a href="index.html#profile">Profile</a>
  <a href="index.html#career">Career</a>
  <a href="index.html#clients">Clients</a>
  <a href="gallery.html">Gallery</a>
  <a href="contact.html">Contact</a>
</div>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="page-header-inner">
    <h1 class="page-title">Gallery</h1>
    <div class="page-meta">
      <span class="page-sub">Photography · Film · Drone</span>
      <a class="ig-link" href="https://www.instagram.com/united610/" target="_blank" rel="noopener">
        ◎ &nbsp;@united610
      </a>
    </div>
  </div>
</div>

<!-- GALLERY -->
<div class="gallery-wrap">
  <div class="bar">
    <p class="post-count" id="postCount"></p>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lb-inner">
    <button class="lb-close" id="lbClose">✕</button>
    <div class="lb-controls">
      <button class="lb-arrow" id="lbPrev">&#8592;</button>
      <button class="lb-arrow" id="lbNext">&#8594;</button>
    </div>
    <p class="lb-counter" id="lbCounter"></p>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <img class="footer-logo" src="img/UFLogo_white2.png" alt="United Functions">
  <p class="footer-text">&copy; United Functions. All rights reserved.</p>
</footer>

<script>
  const VIDEO_EXTS = ['.mp4', '.mov', '.webm'];
  const isVideo = s => VIDEO_EXTS.some(e => s.toLowerCase().endsWith(e));
  const isYT    = s => s.includes('youtu.be/') || s.includes('youtube.com/');
  const ytId    = s => { const m = s.match(/(?:youtu\.be\/|v=)([A-Za-z0-9_-]{11})/); return m ? m[1] : null; };

  let images = [], currentIndex = 0;

  async function init() {
    try {
      const r = await fetch('/api/gallery-images');
      if (r.ok) { images = await r.json(); renderGrid(images); return; }
    } catch (_) {}
    try {
      const r = await fetch('gallery/images.json');
      if (!r.ok) throw new Error();
      images = await r.json();
      renderGrid(images);
    } catch {
      document.getElementById('grid').innerHTML = `
        <div style="padding:4rem 2rem;grid-column:1/-1">
          <p style="font-size:1.4rem;font-weight:700;margin-bottom:1rem;">画像リストが見つかりません</p>
          <p style="font-size:0.82rem;color:var(--muted);line-height:2;">
            ターミナルで <code style="background:#f0f0f0;padding:.2rem .5rem;">python3 update-gallery.py</code> を実行してください。
          </p>
        </div>`;
    }
  }

  function renderGrid(imgs) {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    document.getElementById('postCount').textContent = `${imgs.length} works`;

    imgs.forEach((src, i) => {
      const item = document.createElement('div');
      item.className = 'grid-item';
      const yt    = isYT(src);
      const video = !yt && isVideo(src);

      if (yt) {
        const id = ytId(src);
        item.innerHTML = `
          <img src="https://img.youtube.com/vi/${id}/maxresdefault.jpg" alt="" loading="lazy">
          <span class="video-badge">VIDEO</span>
          <div class="grid-overlay"><span class="overlay-icon">&#9654;</span></div>`;
      } else if (video) {
        item.innerHTML = `
          <video src="${src}" muted loop playsinline preload="metadata"></video>
          <span class="video-badge">VIDEO</span>
          <div class="grid-overlay"><span class="overlay-icon">&#9654;</span></div>`;
        const v = item.querySelector('video');
        item.addEventListener('mouseenter', () => v.play());
        item.addEventListener('mouseleave', () => { v.pause(); v.currentTime = 0; });
      } else {
        item.innerHTML = `
          <img src="${src}" alt="" loading="lazy">
          <div class="grid-overlay"><span class="overlay-icon">+</span></div>`;
      }

      item.addEventListener('click', () => openLB(i));
      item.style.transitionDelay = `${(i % 8) * 45}ms`;
      grid.appendChild(item);
    });

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); } });
    }, { threshold: 0.06 });
    document.querySelectorAll('.grid-item').forEach(el => obs.observe(el));
  }

  function openLB(i) {
    currentIndex = i; updateLB();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }
  function closeLB() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
    const v = document.querySelector('.lb-inner video'); if (v) v.pause();
    const f = document.querySelector('.lb-inner iframe'); if (f) f.src = f.src;
  }
  function updateLB() {
    const src   = images[currentIndex];
    const inner = document.querySelector('.lb-inner');
    const old   = inner.querySelector('img, video, iframe');
    if (old) old.remove();

    let media;
    if (isYT(src)) {
      const id = ytId(src);
      media = document.createElement('iframe');
      media.src = `https://www.youtube.com/embed/${id}?autoplay=1`;
      media.allow = 'autoplay; encrypted-media; fullscreen';
      media.setAttribute('allowfullscreen', '');
      media.style.cssText = 'width:100%;aspect-ratio:16/9;border:none;';
    } else if (isVideo(src)) {
      media = document.createElement('video');
      media.src = src; media.controls = true; media.autoplay = true;
      media.setAttribute('playsinline', '');
    } else {
      media = document.createElement('img');
      media.src = src; media.alt = '';
    }
    inner.insertBefore(media, inner.querySelector('.lb-controls'));
    document.getElementById('lbCounter').textContent = `${currentIndex + 1} / ${images.length}`;
  }
  function prev() { currentIndex = (currentIndex - 1 + images.length) % images.length; updateLB(); }
  function next() { currentIndex = (currentIndex + 1) % images.length; updateLB(); }

  document.getElementById('lbClose').addEventListener('click', closeLB);
  document.getElementById('lbPrev').addEventListener('click', prev);
  document.getElementById('lbNext').addEventListener('click', next);
  document.getElementById('lightbox').addEventListener('click', e => { if (e.target === document.getElementById('lightbox')) closeLB(); });
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLB();
    if (e.key === 'ArrowLeft') prev();
    if (e.key === 'ArrowRight') next();
  });

  document.getElementById('navToggle').addEventListener('click', () => document.getElementById('mobMenu').classList.add('open'));
  document.getElementById('mobClose').addEventListener('click', () => document.getElementById('mobMenu').classList.remove('open'));

  init();
</script>
</body>
</html>
