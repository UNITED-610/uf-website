<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Video | United Functions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #ffffff;
      --fg:     #000000;
      --muted:  #666666;
      --dim:    #aaaaaa;
      --border: rgba(0,0,0,0.1);
      --font:   'Inter', 'Helvetica Neue', sans-serif;
    }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font);
      font-weight: 300;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── NAV ─── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      padding: 1.2rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255,255,255,0.96);
      backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo img { height: clamp(12px, 3vw, 18px); transition: opacity 0.3s; }
    .nav-logo img:hover { opacity: 0.5; }
    .nav-links { display: flex; gap: 2.5rem; list-style: none; }
    .nav-links a {
      color: var(--fg);
      text-decoration: none;
      font-size: 0.68rem;
      font-weight: 400;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      transition: opacity 0.3s;
    }
    .nav-links a:hover, .nav-links a.active { opacity: 0.35; }
    .nav-toggle { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 4px; }
    .nav-toggle span { display: block; width: 22px; height: 1px; background: var(--fg); }

    /* ─── PAGE HEADER ─── */
    .page-header {
      padding: clamp(7rem, 14vw, 10rem) clamp(1.5rem, 4vw, 3rem) 0;
      border-bottom: 1px solid var(--fg);
    }
    .page-header-inner {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding-bottom: 1.5rem;
    }
    .page-title {
      font-size: clamp(3.5rem, 10vw, 9rem);
      font-weight: 900;
      letter-spacing: -0.04em;
      text-transform: uppercase;
      line-height: 0.9;
    }
    .page-meta {
      text-align: right;
      flex-shrink: 0;
    }
    .page-sub {
      font-size: 0.68rem;
      letter-spacing: 0.22em;
      color: var(--muted);
      text-transform: uppercase;
      display: block;
      margin-bottom: 0.5rem;
    }

    /* ─── VIDEO GRID ─── */
    .video-wrap {
      padding: 3rem clamp(1.5rem, 4vw, 3rem) 6rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .video-count {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--dim);
      text-transform: uppercase;
      margin-bottom: 2.5rem;
    }

    .video-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
    }
    @media (max-width: 1000px) { .video-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 580px)  { .video-grid { grid-template-columns: 1fr; } }

    .video-card {
      position: relative;
      overflow: hidden;
      background: #111;
      cursor: pointer;
      opacity: 0;
      transform: translateY(16px);
      transition: opacity 0.5s ease, transform 0.5s ease;
    }
    .video-card.visible { opacity: 1; transform: translateY(0); }

    .video-thumb {
      position: relative;
      aspect-ratio: 16 / 9;
      overflow: hidden;
    }
    .video-thumb img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.5s ease, filter 0.4s ease;
      filter: grayscale(20%);
    }
    .video-card:hover .video-thumb img {
      transform: scale(1.05);
      filter: grayscale(0%);
    }

    .play-btn {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,0);
      transition: background 0.35s;
    }
    .video-card:hover .play-btn { background: rgba(0,0,0,0.35); }

    .play-icon {
      width: 52px; height: 52px;
      border: 1px solid rgba(255,255,255,0.8);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      color: rgba(255,255,255,0.9);
      font-size: 1rem;
      opacity: 0;
      transform: scale(0.85);
      transition: opacity 0.3s, transform 0.3s;
      padding-left: 3px;
    }
    .video-card:hover .play-icon { opacity: 1; transform: scale(1); }

    .video-info {
      padding: 1rem 1.2rem 1.3rem;
      background: #000;
    }
    .video-category {
      font-size: 0.55rem;
      font-weight: 400;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.3);
      margin-bottom: 0.4rem;
    }
    .video-title {
      font-size: 0.82rem;
      font-weight: 500;
      color: rgba(255,255,255,0.85);
      letter-spacing: 0.02em;
      line-height: 1.5;
    }

    /* ─── LIGHTBOX ─── */
    .lightbox {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.97);
      z-index: 300;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .lightbox.open { display: flex; }

    .lb-inner {
      position: relative;
      width: min(880px, 100%);
    }
    .lb-iframe {
      width: 100%;
      aspect-ratio: 16 / 9;
      border: none;
      display: block;
    }
    .lb-close {
      position: absolute;
      top: -2.8rem; right: 0;
      background: none; border: none;
      color: rgba(255,255,255,0.4);
      font-size: 1.4rem;
      cursor: pointer;
      transition: color 0.25s;
    }
    .lb-close:hover { color: #fff; }

    /* ─── FOOTER ─── */
    footer {
      padding: 2.5rem 3rem;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-logo { height: 16px; }
    .footer-text { font-size: 0.62rem; letter-spacing: 0.18em; color: var(--dim); text-transform: uppercase; }

    /* ─── MOBILE MENU ─── */
    .mob-menu {
      display: none; position: fixed; inset: 0;
      background: #000; z-index: 200;
      flex-direction: column; justify-content: center; align-items: center; gap: 1.8rem;
    }
    .mob-menu.open { display: flex; }
    .mob-menu a {
      color: #fff; text-decoration: none;
      font-size: clamp(2rem, 8vw, 3.5rem);
      font-weight: 800; letter-spacing: -0.03em; text-transform: uppercase;
      transition: opacity 0.3s;
    }
    .mob-menu a:hover { opacity: 0.35; }
    .mob-close {
      position: absolute; top: 1.5rem; right: 2rem;
      background: none; border: none; color: #fff; font-size: 1.5rem; cursor: pointer;
    }

    @media (max-width: 768px) {
      nav { padding: 1rem 1.5rem; }
      .nav-links { display: none; }
      .nav-toggle { display: flex; }
      .page-header-inner { flex-direction: column; align-items: flex-start; gap: 1.5rem; }
      .page-meta { text-align: left; }
      footer { flex-direction: column; gap: 1rem; text-align: center; }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <a class="nav-logo" href="index.html">
    <img src="img/UFLogo_white2.png" alt="United Functions">
  </a>
  <ul class="nav-links">
    <li><a href="index.html#profile">Profile</a></li>
    <li><a href="index.html#career">Career</a></li>
    <li><a href="index.html#clients">Clients</a></li>
    <li><a href="gallery.html">Gallery</a></li>
    <li><a href="video.html" class="active">Video</a></li>
    <li><a href="contact.html">Contact</a></li>
  </ul>
  <div class="nav-toggle" id="navToggle"><span></span><span></span><span></span></div>
</nav>

<!-- MOBILE MENU -->
<div class="mob-menu" id="mobMenu">
  <button class="mob-close" id="mobClose">✕</button>
  <a href="index.html#profile">Profile</a>
  <a href="index.html#career">Career</a>
  <a href="index.html#clients">Clients</a>
  <a href="gallery.html">Gallery</a>
  <a href="video.html">Video</a>
  <a href="contact.html">Contact</a>
</div>

<!-- PAGE HEADER -->
<div class="page-header">
  <div class="page-header-inner">
    <h1 class="page-title">Video</h1>
    <div class="page-meta">
      <span class="page-sub">Cinematography · Drone</span>
    </div>
  </div>
</div>

<!-- VIDEO GRID -->
<div class="video-wrap">
  <p class="video-count" id="videoCount"></p>
  <div class="video-grid" id="videoGrid"></div>
</div>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <div class="lb-inner">
    <button class="lb-close" id="lbClose">✕</button>
    <iframe class="lb-iframe" id="lbFrame" src="" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>
  </div>
</div>

<!-- FOOTER -->
<footer>
  <img class="footer-logo" src="img/UFLogo_white2.png" alt="United Functions">
  <p class="footer-text">&copy; United Functions. All rights reserved.</p>
</footer>

<script>
  // ─── VIDEO DATA ───────────────────────────────────────────
  // title と category を自由に編集してください
  // platform: 'youtube' | 'vimeo'
  const VIDEOS = [
    {
      id:       'jNzBQoni5Jg',
      platform: 'youtube',
      title:    '',
      category: '',
    },
    {
      id:       'uSHdaKpkcvg',
      platform: 'youtube',
      title:    '',
      category: '',
    },
    {
      id:       '-kCFGeYrQyQ',
      platform: 'youtube',
      title:    '',
      category: '',
    },
  ];
  // ─────────────────────────────────────────────────────────

  function thumbUrl(v) {
    if (v.platform === 'youtube') return `https://img.youtube.com/vi/${v.id}/maxresdefault.jpg`;
    if (v.platform === 'vimeo')   return `https://vumbnail.com/${v.id}.jpg`;
    return '';
  }

  function embedUrl(v) {
    if (v.platform === 'youtube') return `https://www.youtube.com/embed/${v.id}?autoplay=1&rel=0`;
    if (v.platform === 'vimeo')   return `https://player.vimeo.com/video/${v.id}?autoplay=1`;
    return '';
  }

  function renderGrid() {
    const grid = document.getElementById('videoGrid');
    document.getElementById('videoCount').textContent = `${VIDEOS.length} works`;

    VIDEOS.forEach((v, i) => {
      const card = document.createElement('div');
      card.className = 'video-card';
      const fallback = v.platform === 'youtube'
        ? `https://img.youtube.com/vi/${v.id}/hqdefault.jpg` : '';
      card.innerHTML = `
        <div class="video-thumb">
          <img src="${thumbUrl(v)}" alt="${v.title}" loading="lazy"
               onerror="if(this.src!=='${fallback}')this.src='${fallback}'">
          <div class="play-btn"><span class="play-icon">&#9654;</span></div>
        </div>
        <div class="video-info">
          ${v.category ? `<p class="video-category">${v.category}</p>` : ''}
          ${v.title    ? `<p class="video-title">${v.title}</p>` : ''}
        </div>`;

      card.style.transitionDelay = `${i * 80}ms`;
      card.addEventListener('click', () => openLB(v));
      grid.appendChild(card);
    });

    const obs = new IntersectionObserver(entries => {
      entries.forEach(e => {
        if (e.isIntersecting) { e.target.classList.add('visible'); obs.unobserve(e.target); }
      });
    }, { threshold: 0.06 });
    document.querySelectorAll('.video-card').forEach(el => obs.observe(el));
  }

  function openLB(v) {
    document.getElementById('lbFrame').src = embedUrl(v);
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLB() {
    document.getElementById('lbFrame').src = '';
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  document.getElementById('lbClose').addEventListener('click', closeLB);
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target === document.getElementById('lightbox')) closeLB();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeLB();
  });

  document.getElementById('navToggle').addEventListener('click', () => document.getElementById('mobMenu').classList.add('open'));
  document.getElementById('mobClose').addEventListener('click', () => document.getElementById('mobMenu').classList.remove('open'));
  document.querySelectorAll('.mob-menu a').forEach(a => {
    a.addEventListener('click', () => document.getElementById('mobMenu').classList.remove('open'));
  });

  renderGrid();
</script>
</body>
</html>
